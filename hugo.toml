  #   name = 'Json Feed'
  #   url = '/feed.json'
  #   weight = 3

[pagination]
  pagerSize = 10

[taxonomies]
  tag = 'tags'
  category = 'categories'

[module]
  [[module.imports]]
    path = 'github.com/MihaiValentin/lunr-languages'


[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.highlight]
    # false due to generated Syntax Highlighter CSS
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        # Enable custom attribute support for blocks
        block = true


[frontmatter]
  lastmod = ['lastmod', ':git', 'modified', 'date', 'publishdate', 'pubdate', 'published']


[minify]
  # Do not minify XML files to avoid CDATA escape issues
  disableXML = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepQuotes = true