baseURL = 'https://example.org/'
languageCode = 'en-us'
title = "The Wall"
theme = 'ed'
enableRobotsTXT = true
refLinksErrorLevel = 'WARNING'
[params]
  description = ''
  mainSections = ['posts', 'dramas', 'narratives', 'poems']
  colorScheme = 'red'
  readmore = true
  recentPostsSize = 5
  tagline = "Surely I'm Joking"
  dateFormat = ':date_long'
  dateFormatToc = '2006.01.02'
  footer = 'Built with <a href="https://github.com/sergeyklay/gohugo-theme-ed" target="_blank" rel="noopener noreferrer">Ed</a>. Distributed under an MIT license.'

  showAuthor = true
  [params.author]
    name = 'spp'
    email = 'sun.april.moon@gmail.com'
    # github = 'sergeyklay'
    # twitter = 'egreps'
    location = 'nowhere'


  [params.privacy]
    [params.privacy.googleTagManager]
      disable = true
      respectDoNotTrack = true
  # [params.search]
  #   maxSummaryLength = 100
  #   languages = ['en']

[languages]
  [languages.en]
    languageCode = 'en'
    languageDirection = 'ltr'
    languageName = 'English'
    weight = 1

[menus]
  [[menus.main]]        # sections in the website sidebar
    identifier = 'home' # menu item id
    name = 'Home'       # menu item display title
    pageRef = '/'       # path to the page
    weight = 1          # order of the menu item
  [[menus.main]]
    identifier = 'about'
    name = 'About'
    pageRef = '/about'
    weight = 2
  # [[menus.main]]
  #   identifier = 'credits'
  #   name = 'Credits'
  #   pageRef = '/credits'
